<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <title>Bệnh viện Tâm An</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 shadow-sm border-b border-slate-200 dark:border-slate-700">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-xl font-bold text-sky-500">Bệnh viện Tâm An</span>
            <div class="flex items-center space-x-4">
                <button id="theme-toggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700">🌙</button>
                <span class="text-sm font-medium">Xin chào, Admin</span>
            </div>
        </div>
    </header>

    <!-- Nội dung Dashboard -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold mb-2">TRANG QUẢN TRỊ</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Theo dõi tổng quan hệ thống bệnh viện</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h2 class="text-lg font-semibold mb-4">Thông tin quản trị</h2>
                <p><strong>Họ tên:</strong> Admin</p>
                <p><strong>Email:</strong> admin@gmail.com</p>
            </div>
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h2 class="text-lg font-semibold mb-4">Thống kê</h2>
                <div id="stats-container" class="grid grid-cols-2 gap-4 text-sm">
                    <!-- Dữ liệu JS sẽ đổ vào đây -->
                </div>
            </div>
        </div>
    </main>

    <!-- Nhúng file xử lý logic JavaScript -->
    <script type="module" src="./admin.js"></script>
</body>
</html>
